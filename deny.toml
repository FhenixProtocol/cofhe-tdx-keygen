# cargo-deny v2 config. CI runs `cargo deny check` (advisories, licenses, bans,
# sources) on the whole workspace, as teecryptor and zee-k-verifier do. A new
# license in the dependency tree is added here on purpose, never by default.

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Fail on unmaintained crates only when we depend on them directly. Transitive ones
# from the tfhe and google-cloud trees are out of our control.
unmaintained = "workspace"
ignore = [
    # crypto-bigint < 0.7.6 timing variability. 0.5.5 is forced by elliptic-curve 0.13
    # (k256, and vsss-rs for the Shamir split). The fix needs k256 0.14 and a vsss-rs
    # release on it, so revisit on that bump.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
confidence-threshold = 0.8
# keygen and cofhe-keys carry the Fhenix license via `license-file` (not an SPDX
# id), so the license check skips first-party crates.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-3-Clause-Clear",       # tfhe-rs
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "CDLA-Permissive-2.0",      # webpki-roots: Mozilla root certificate data
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
