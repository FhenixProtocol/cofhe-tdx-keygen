name: Build keygen TDX image
run-name: Build keygen TDX image — ${{ inputs.tag }}

# This workflow builds the keygen image. It pushes the image to the shared
# fhenix-artifacts-registry project, repo cofhe-tee-keygen. It uses GitHub
# Actions Workload Identity Federation. There is NO long-lived GCP key.
#
# The WIF pool, the provider and the keygen-publisher SA live in
# fhenix-artifacts-registry. An operator creates them manually, as for
# teecryptor and zee-k-verifier. This repo's terraform does NOT create them.
#
# The provider CEL pins this repo and this workflow's job_workflow_ref. Thus a
# new file name breaks the federation. A run from a different ref also breaks
# it. The federation stays broken until an operator updates the CEL.
#
# The auth step reads three non-secret repo variables: KEYGEN_WIF_PROVIDER,
# KEYGEN_PUBLISHER_SA and KEYGEN_IMAGE_REGISTRY.
#
# The job attests SLSA build provenance for the pushed digest. It uses this
# workflow's OIDC token and Fulcio. No signing key exists. The attestation goes
# to the public Rekor log, and GitHub serves it on a public API that needs no
# account.
#
# The runtime gate does not change. The partner CEL pins the image_digest only.
# The partner checks provenance at PIN time. See DESIGN.md paragraph 13.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1, v2.0.1, dev-myname)"
        required: true
        type: string

# A Confidential Space VM accepts linux/amd64 only.
permissions:
  contents: read
  actions: read # read the ci.yml workflow runs for this commit
  id-token: write # OIDC → GCP WIF
  attestations: write # SLSA build provenance → Fulcio + public Rekor

env:
  PLATFORM: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The image digest goes into the partner attestation CEL. The same image
      # runs the key ceremony. Thus this job must not build a commit that has a
      # red CI run. A branch rule is not sufficient. A user can start this job
      # while CI still runs. A user can also start it after CI fails. This step
      # runs first. A red commit gets no GCP credentials. It writes nothing to
      # the registry.
      #
      # The step reads the workflow-runs API. It does not read the check-runs
      # API. GitHub does not authenticate a check-run name. Any user with write
      # access can POST a check run. That user sets the name "ci" and the
      # conclusion "success" on any SHA. A gate that matches the name accepts
      # it. A workflow run exists only after Actions runs ci.yml. GitHub sets
      # the event, branch and conclusion fields. The caller cannot set them.
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          CI_WORKFLOW: ci.yml
        run: |
          set -euo pipefail
          # The WIF provider CEL pins this workflow to main. That CEL lives in
          # GCP, not in this repo. Test the branch here also. ci.yml runs on
          # pull_request too. Without this test, a PR head passes the gate.
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::this job runs from refs/heads/main only. Got ${REF}"
            exit 1
          fi
          # The filter tests head_sha again on the client. GitHub ignores a
          # query parameter that it does not know. A typo in the parameter name
          # widens the query to every run on main. The gate then accepts any
          # green commit. Measured: "?sha=" returns 100 runs. "?head_sha="
          # returns 1.
          run_ids="$(gh api --paginate \
            "repos/${REPO}/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${SHA}&per_page=100" \
            --jq '.workflow_runs[]
                  | select(.head_sha == env.SHA and .event == "push"
                           and .head_branch == "main" and .status == "completed"
                           and .conclusion == "success")
                  | .id')"
          run_id="${run_ids%%$'\n'*}"
          if [ -z "${run_id}" ]; then
            echo "::error::no green push run of ${CI_WORKFLOW} on main for commit ${SHA}"
            echo "::error::this job does not build a commit without a green CI run"
            exit 1
          fi
          # A run concludes "success" when every job succeeds OR SKIPS. Thus
          # the run conclusion does not prove that the gates ran. One "if:" on a
          # job empties this gate. The gate still reports green. Thus each job
          # must conclude "success". This test reads conclusions, not job names.
          # No list here tracks ci.yml.
          not_green="$(gh api --paginate \
            "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion != "success")
                  | "\(.name) concluded \(.conclusion)"')"
          if [ -n "${not_green}" ]; then
            echo "::error::CI run ${run_id} has a job that did not pass:"
            echo "${not_green}"
            echo "::error::this job does not build a commit without a green CI run"
            exit 1
          fi
          echo "Green CI for ${SHA}: run ${run_id}"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          # The job impersonates the keyless publisher SA. No key exists for it.
          # The auth action makes an access token by SA impersonation only.
          workload_identity_provider: ${{ vars.KEYGEN_WIF_PROVIDER }}
          service_account: ${{ vars.KEYGEN_PUBLISHER_SA }}
          # This value must match the provider allowed_audiences. GCP uses the
          # "no-scheme" URI form.
          audience: //iam.googleapis.com/${{ vars.KEYGEN_WIF_PROVIDER }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.KEYGEN_IMAGE_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The build makes one platform. Thus this digest is the amd64 platform
      # digest. The attestation and the partner pin both name it.
      - name: Build and push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ vars.KEYGEN_IMAGE_REGISTRY }}:${{ inputs.tag }}
          provenance: false

      # The certificate Fulcio issues names this repo, this workflow, the ref and
      # the commit. Those are the four fields the partner asserts at pin time.
      #
      # Pinned by SHA, as is every other action in this file. A moved tag here
      # would forge provenance for every image we ship.
      #
      # push-to-registry stays FALSE. GitHub serves the bundle on a public API
      # that needs no account, which is where the partner reads it. Pushing it to
      # the registry as well needs registry credentials in a form this action
      # cannot read, and buys nothing.
      - name: Attest SLSA build provenance
        id: attest
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ vars.KEYGEN_IMAGE_REGISTRY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      # always(), so a failure above never costs the operator the digest. A
      # pushed image with no recorded digest is the worse outcome.
      - name: Summarize
        if: always() && steps.push.outputs.digest != ''
        env:
          REGISTRY: ${{ vars.KEYGEN_IMAGE_REGISTRY }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT: ${{ github.sha }}
          # CONSTANTS, written out in full and deliberately NOT derived from this
          # run. A command that asserts whatever the run already was proves
          # nothing. These are the values the partner tooling bakes in.
          REPO: FhenixProtocol/cofhe-tdx-keygen
          SIGNER_WORKFLOW: FhenixProtocol/cofhe-tdx-keygen/.github/workflows/build-keygen-tdx.yml
          REF: refs/heads/main
          # The handoff is only safe to use when provenance actually exists.
          ATTESTED: ${{ steps.attest.outcome == 'success' }}
        run: |
          set -euo pipefail
          {
            echo "## keygen image built"
            echo
            echo "**Tag:** \`${TAG}\`"
            echo
            if [ "${ATTESTED}" != "true" ]; then
              echo "> ### NO ATTESTATION — DO NOT HAND THIS TO A PARTNER"
              echo ">"
              echo "> The attestation step did not succeed, so no provenance exists"
              echo "> for this digest. A partner check on it fails, and the failure"
              echo "> reads like tampering. Re-run the build."
              echo
              echo "**Digest (for recovery only):**"
              echo
              echo '```'
              echo "${DIGEST}"
              echo '```'
            else
              echo "### Hand these two values to each partner"
              echo
              echo '```hcl'
              echo "image_digest = \"${DIGEST}\""
              echo "source_sha   = \"${COMMIT}\""
              echo '```'
              echo
              echo "That is the whole handoff. The partner tooling holds the rest"
              echo "as fixed constants."
            echo
              echo
              echo "### Verify this image"
              echo
              echo "The partner tool in key-share-holders (\`partner/verify-image.sh\`)"
              echo "is the authoritative check and holds these values as constants."
              echo "This is the same check, spelled out, for anyone without that repo."
              echo "It runs on any machine and needs no Fhenix credential and no"
              echo "GitHub account. A non-zero exit means: do not pin."
              echo
              echo '```bash'
              echo "# -f so a missing attestation fails here, loudly, rather than"
              echo "# writing \"null\" into bundle.json and confusing gh."
              echo "curl -fsSL https://api.github.com/repos/${REPO}/attestations/${DIGEST} \\"
              echo "  | jq '.attestations[0].bundle' > bundle.json"
              echo
              echo "gh attestation verify oci://${REGISTRY}@${DIGEST} \\"
              echo "  --bundle bundle.json \\"
              echo "  --repo ${REPO} \\"
              echo "  --signer-workflow ${SIGNER_WORKFLOW} \\"
              echo "  --source-ref ${REF} \\"
              echo "  --source-digest ${COMMIT}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
